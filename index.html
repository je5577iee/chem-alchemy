<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>化學煉金術</title>
<!--
  化學煉金術：把物質放進燒杯、選條件，發現新的物質
  - 單一 HTML 檔，完全離線可用，不引用任何外部資源
  - 所有反應都是國中、高中課本常見的真實反應，方程式已配平
  - 進度只存在本機瀏覽器，不蒐集任何個人資料
-->
<style>
:root{
  --bg:#171a33; --panel:#22264a; --panel2:#2b3060; --ink:#eef0ff; --soft:#a9afd8; --line:#3a4078;
  --cyan:#5ef2d6; --pink:#ff7ab6; --warn:#ffb057;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{
  color:var(--ink); font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:
    radial-gradient(circle at 15% 0%, rgba(94,242,214,.12), transparent 40%),
    radial-gradient(circle at 90% 100%, rgba(255,122,182,.12), transparent 40%),
    radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.5px) 0 0/22px 22px,
    var(--bg);
  background-attachment:fixed;
  user-select:none; -webkit-user-select:none;
}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none; touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}
[hidden]{display:none !important}
#app{max-width:1180px; margin:0 auto; padding:14px 16px 30px}
sub{font-size:.7em}

/* ---------- 頂部 ---------- */
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.logo{display:flex; align-items:center; gap:10px}
.logo svg{width:44px; height:44px}
.logo h1{margin:0; font-size:clamp(24px,6vw,32px); letter-spacing:3px; background:linear-gradient(90deg, var(--cyan), var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent}
.prog{font-weight:800; color:var(--soft); font-variant-numeric:tabular-nums}
.prog b{color:var(--cyan); font-size:1.15em}
.tabs{margin-left:auto; display:flex; gap:6px; background:var(--panel); padding:5px; border-radius:12px}
.tab{padding:8px 14px; border-radius:9px; font-weight:800; color:var(--soft); position:relative}
.tab.on{background:var(--panel2); color:var(--ink); box-shadow:inset 0 -3px 0 var(--cyan)}
.tab .badge{position:absolute; top:-4px; right:-4px; background:var(--pink); color:#fff; font-size:11px; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px}
.icon-btn{padding:8px 10px; border-radius:9px; background:var(--panel); color:var(--soft); font-weight:700; font-size:14px}
.view{display:none} .view.on{display:block}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px}
.panel h2{margin:0 0 10px; font-size:16px; color:var(--soft); letter-spacing:1px}

/* ---------- 實驗台 ---------- */
.lab{display:grid; grid-template-columns:minmax(0,1fr); gap:14px}
.bench{display:grid; gap:12px}
.slots{display:flex; align-items:center; justify-content:center; gap:10px}
.slot{width:104px; height:104px; border-radius:12px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--soft); font-size:13px; text-align:center; padding:6px; background:rgba(0,0,0,.15)}
.slot .tile{width:100%; height:100%; cursor:pointer}
.plus{font-size:28px; font-weight:900; color:var(--soft)}
.flaskwrap{display:flex; justify-content:center}
.flask{width:150px; height:150px}
.flask .liq{transition:fill .6s}
.flask.boil .bub{animation:bub 1.1s ease-in infinite}
.flask.boil .bub:nth-child(2){animation-delay:.3s} .flask.boil .bub:nth-child(3){animation-delay:.6s} .flask.boil .bub:nth-child(4){animation-delay:.85s}
.bub{opacity:0}
@keyframes bub{0%{transform:translateY(0); opacity:0} 20%{opacity:.9} 100%{transform:translateY(-60px); opacity:0}}
.flask.fail{animation:wob .4s}
@keyframes wob{25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)}}
.conds{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.cond{border-radius:10px; background:var(--panel2); padding:8px 2px; font-weight:800; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:2px; border:2px solid transparent; color:var(--soft)}
.cond .e{font-size:22px}
.cond.on{border-color:var(--cyan); color:var(--ink); background:#323a73}
.go{width:100%; padding:14px; border-radius:12px; font-size:21px; font-weight:900; color:#10132a; background:linear-gradient(90deg, var(--cyan), #8af5a5); box-shadow:0 4px 0 #2a9e88}
.go:active{transform:translateY(3px); box-shadow:0 1px 0 #2a9e88}
.go:disabled{opacity:.4; transform:none}
.result{min-height:90px; border-radius:12px; background:rgba(0,0,0,.2); padding:12px 14px; line-height:1.6}
.result .eq{font-size:clamp(17px,4.6vw,22px); font-weight:900; letter-spacing:.5px; margin:2px 0 6px; word-break:keep-all; overflow-wrap:anywhere}
.result .note{color:var(--soft); font-size:15px}
.result .warn{color:var(--warn); font-size:14px; font-weight:800; margin-top:4px}
.result .prods{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.result .prods .tile{width:84px; height:84px}
.result .meh{color:var(--soft); font-weight:700}
.result .tip{color:var(--cyan); font-weight:800}
.result .mini{font-size:13px; color:var(--soft)}

/* 物質格子：像週期表的一格 */
.inv-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.filters{display:flex; gap:6px; flex-wrap:wrap}
.fchip{padding:5px 10px; border-radius:999px; background:var(--panel2); font-size:13px; font-weight:800; color:var(--soft); display:flex; align-items:center; gap:5px}
.fchip i{width:10px; height:10px; border-radius:3px; display:inline-block}
.fchip.on{background:var(--ink); color:#151833}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:8px}
.tile{position:relative; aspect-ratio:1; min-width:0; border-radius:10px; background:#fff; color:#151833; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px; text-align:center; border-top:7px solid var(--cc); box-shadow:0 3px 0 rgba(0,0,0,.35); transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile .fm{font-weight:900; font-size:19px; line-height:1.1; white-space:nowrap; max-width:100%; overflow:hidden}
.tile .nm{font-size:12px; font-weight:800; color:#555b7a; margin-top:3px; line-height:1.15}
.tile.new::after{content:"新！"; position:absolute; top:-9px; right:-7px; background:var(--pink); color:#fff; font-size:11px; font-weight:900; padding:2px 6px; border-radius:999px}
.tile.picked{outline:3px solid var(--cyan); outline-offset:1px}
.tile.unk{background:var(--panel2); color:var(--soft); border-top-color:var(--line); box-shadow:none}
.tile.unk .fm{font-size:26px}

/* ---------- 任務 ---------- */
.missions{display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(260px,1fr))}
.mis{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:grid; gap:6px}
.mis .t{font-weight:900; font-size:18px; display:flex; gap:8px; align-items:center}
.mis .t .ok{margin-left:auto; color:#8af5a5; font-size:15px}
.mis .d{color:var(--soft); font-size:14px}
.mis .h{font-size:14px; color:var(--cyan); font-weight:700; line-height:1.6}
.mis .hb{justify-self:start; padding:5px 10px; border-radius:8px; background:var(--panel2); font-size:13px; font-weight:800; color:var(--soft)}
.mis.done{border-color:#2f8a63; background:#1f3a3f}

/* ---------- 圖鑑 ---------- */
.book-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.book-top .r{margin-left:auto}
.cat-sec h3{margin:14px 0 8px; font-size:15px; display:flex; align-items:center; gap:8px}
.cat-sec h3 i{width:14px; height:14px; border-radius:4px}
.modal{position:fixed; inset:0; background:rgba(10,12,30,.7); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50}
.mbox{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; width:100%; max-width:440px; max-height:90vh; overflow:auto}
.mbox .big{display:flex; gap:14px; align-items:center}
.mbox .big .tile{width:96px; height:96px; flex:none}
.mbox h3{margin:0; font-size:24px}
.mbox .cat{color:var(--soft); font-weight:700}
.mbox p{line-height:1.7}
.mbox .how{font-size:14px; color:var(--soft); line-height:1.8}
.mbox .how b{color:var(--ink)}
.mbox .close{margin-top:12px; width:100%; padding:10px; border-radius:10px; background:var(--panel2); font-weight:800}
.toast{position:fixed; left:50%; top:16px; transform:translateX(-50%); background:linear-gradient(90deg, #2a9e88, #6a4fc9); color:#fff; padding:10px 18px; border-radius:12px; font-weight:900; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.4); animation:drop .3s; max-width:92vw; text-align:center}
@keyframes drop{from{transform:translate(-50%,-20px); opacity:0}}
#jump{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:40; background:linear-gradient(90deg, var(--cyan), #8af5a5); color:#10132a; font-weight:900; padding:10px 18px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.45); white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis}
.safety{font-size:12.5px; color:var(--soft); text-align:center; margin-top:14px}

@media (min-width:880px){
  .lab{grid-template-columns:minmax(0,1fr) 400px; align-items:start}
  .bench{position:sticky; top:12px; order:2}
  .inv{order:1}
}
@media (max-width:420px){
  .slot{width:92px; height:92px}
  .grid{grid-template-columns:repeat(auto-fill, minmax(74px,1fr))}
  .tile .fm{font-size:17px}
  .cond{font-size:12px}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 4h12M20 4v14L8 40a3 3 0 0 0 3 4h26a3 3 0 0 0 3-4L28 18V4" fill="none" stroke="#5ef2d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M13 32h22l4 8a2 2 0 0 1-2 3H11a2 2 0 0 1-2-3z" fill="#ff7ab6" opacity=".85"/><circle cx="20" cy="26" r="2" fill="#5ef2d6"/><circle cx="27" cy="22" r="1.5" fill="#5ef2d6"/></svg>
      <h1>化學煉金術</h1>
    </div>
    <span class="prog" id="prog"></span>
    <nav class="tabs">
      <button class="tab on" data-v="lab">實驗台</button>
      <button class="tab" data-v="mis">任務<span class="badge" id="misBadge" hidden></span></button>
      <button class="tab" data-v="book">圖鑑</button>
    </nav>
    <button class="icon-btn" id="soundBtn"></button>
  </header>

  <!-- 實驗台 -->
  <section class="view on" id="v-lab">
    <div class="lab">
      <div class="panel bench">
        <h2>燒杯（放 1～2 種物質）</h2>
        <div class="slots">
          <div class="slot" id="slot0">點下面的物質放進來</div>
          <span class="plus">＋</span>
          <div class="slot" id="slot1">可以只放一種</div>
        </div>
        <div class="flaskwrap"><svg class="flask" id="flask" viewBox="0 0 150 150" aria-hidden="true">
          <path d="M60 10h30M64 10v40L28 120a10 10 0 0 0 9 14h76a10 10 0 0 0 9-14L86 50V10" fill="rgba(255,255,255,.06)" stroke="#cfd4ff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
          <path class="liq" id="liq" d="M47 86h56l18 34a7 7 0 0 1-6 10H35a7 7 0 0 1-6-10z" fill="#5ef2d6" opacity=".55"/>
          <g><circle class="bub" cx="62" cy="116" r="4" fill="#fff"/><circle class="bub" cx="80" cy="120" r="3" fill="#fff"/><circle class="bub" cx="92" cy="112" r="4.5" fill="#fff"/><circle class="bub" cx="72" cy="104" r="3" fill="#fff"/></g>
        </svg></div>
        <h2 style="margin:0">反應條件</h2>
        <div class="conds" id="conds"></div>
        <button class="go" id="goBtn">開始反應！</button>
        <div class="result" id="result"><span class="meh">選好物質和條件，按「開始反應」看看會發生什麼事。</span></div>
      </div>
      <div class="panel inv">
        <div class="inv-head"><h2 style="margin:0">我的物質</h2><div class="filters" id="filters"></div></div>
        <div class="grid" id="inv"></div>
      </div>
    </div>
    <p class="safety">⚠️ 遊戲中的反應僅供學習，很多真實操作有毒或會爆炸，請勿自行嘗試。</p>
  </section>

  <!-- 任務 -->
  <section class="view" id="v-mis">
    <div class="missions" id="missions"></div>
  </section>

  <!-- 圖鑑 -->
  <section class="view" id="v-book">
    <div class="book-top"><span class="prog" id="prog2"></span><button class="icon-btn r" id="resetBtn">重新開始</button></div>
    <div id="book"></div>
  </section>
</div>

<button id="jump" hidden></button>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script>
/* =====================================================================
   物質：化學式、名稱、類別、說明；start=一開始就有
   ===================================================================== */
const CATS = {
  nonmetal:{ n:'非金屬元素', c:'#5ef2d6' }, metal:{ n:'金屬元素', c:'#9fb6d6' }, raw:{ n:'原料', c:'#e8c27a' },
  oxide:{ n:'氧化物', c:'#ffa25e' }, acid:{ n:'酸', c:'#ff6b81' }, base:{ n:'鹼', c:'#6f9bff' },
  salt:{ n:'鹽類', c:'#c49bff' }, sol:{ n:'水溶液', c:'#59c8ff' }, other:{ n:'其他化合物', c:'#a5e07a' }, org:{ n:'有機物', c:'#ffd84d' }
};
const S = {
  h2:{ f:'H₂', n:'氫氣', k:'nonmetal', d:'最輕的氣體，可以燃燒。', start:1, lc:'#dff3ff' },
  o2:{ f:'O₂', n:'氧氣', k:'nonmetal', d:'能幫助燃燒，呼吸作用也需要它。', start:1, lc:'#e6f6ff' },
  c:{ f:'C', n:'碳', k:'nonmetal', d:'木炭、石墨、鑽石都是由碳組成的。', start:1, lc:'#55586b' },
  n2:{ f:'N₂', n:'氮氣', k:'nonmetal', d:'空氣中大約 78% 是氮氣，很不活潑。', start:1, lc:'#e8f0ff' },
  cl2:{ f:'Cl₂', n:'氯氣', k:'nonmetal', d:'黃綠色、有刺激性臭味的有毒氣體，可以用來消毒。', start:1, lc:'#d6f07a' },
  s:{ f:'S', n:'硫', k:'nonmetal', d:'黃色固體，又叫硫磺，火山附近很常見。', start:1, lc:'#ffe45c' },
  na:{ f:'Na', n:'鈉', k:'metal', d:'很軟的金屬，可以用刀切開；遇水會劇烈反應，所以保存在煤油裡。', start:1, lc:'#d9dde8' },
  mg:{ f:'Mg', n:'鎂', k:'metal', d:'銀白色的輕金屬，燃燒時發出耀眼的白光。', start:1, lc:'#e4e7ef' },
  ca:{ f:'Ca', n:'鈣', k:'metal', d:'活潑的金屬；骨骼、貝殼、石灰石裡都有鈣的化合物。', start:1, lc:'#e8e8e0' },
  fe:{ f:'Fe', n:'鐵', k:'metal', d:'最常用的金屬，在潮濕的空氣中會生鏽。', start:1, lc:'#8d8f99' },
  cu:{ f:'Cu', n:'銅', k:'metal', d:'紅色的金屬，導電性很好，常用來做電線。', start:1, lc:'#d9824a' },
  oil:{ f:'油脂', n:'動植物油', k:'raw', d:'豬油、椰子油、橄欖油等，是做肥皂的原料。', start:1, lc:'#f5d77a' },

  h2o:{ f:'H₂O', n:'水', k:'oxide', d:'生命不可缺少的物質，也是最常用的溶劑。', lc:'#7fd0ff' },
  co2:{ f:'CO₂', n:'二氧化碳', k:'oxide', d:'會讓澄清石灰水變混濁；植物用它來行光合作用。', lc:'#e6f0f5' },
  co:{ f:'CO', n:'一氧化碳', k:'oxide', d:'無色無味的有毒氣體，會和血液裡的血紅素結合。', lc:'#eef0f5' },
  so2:{ f:'SO₂', n:'二氧化硫', k:'oxide', d:'有刺激性氣味的有毒氣體，是酸雨的成因之一。', lc:'#f2f2dc' },
  so3:{ f:'SO₃', n:'三氧化硫', k:'oxide', d:'溶在水裡會形成硫酸。', lc:'#f6f3e8' },

  no2:{ f:'NO₂', n:'二氧化氮', k:'oxide', d:'紅棕色的有毒氣體，也是酸雨的成因之一。', lc:'#c8642e' },

  cuo:{ f:'CuO', n:'氧化銅', k:'oxide', d:'黑色粉末。', lc:'#2e2b2b' },
  fe3o4:{ f:'Fe₃O₄', n:'四氧化三鐵', k:'oxide', d:'黑色、有磁性，是磁鐵礦的主要成分。', lc:'#33302e' },
  hcl:{ f:'HCl', n:'氯化氫', k:'other', d:'無色、有刺激性的氣體，溶在水裡就是鹽酸。', lc:'#eef5f0' },
  hclaq:{ f:'HCl(aq)', n:'鹽酸', k:'acid', d:'強酸，我們的胃液裡也有鹽酸。', lc:'#ffd0d6' },

  h2so3:{ f:'H₂SO₃', n:'亞硫酸', k:'acid', d:'二氧化硫溶在雨水中形成，是酸雨的成分。', lc:'#fff0c8' },
  h2so4:{ f:'H₂SO₄', n:'硫酸', k:'acid', d:'最重要的工業原料之一；濃硫酸有強烈的脫水性。', lc:'#ffe2b8' },
  hno3:{ f:'HNO₃', n:'硝酸', k:'acid', d:'強酸，可以用來製造肥料和染料。', lc:'#ffe8a8' },
  naoh:{ f:'NaOH', n:'氫氧化鈉', k:'base', d:'強鹼，俗稱燒鹼、苛性鈉，有很強的腐蝕性。', lc:'#d8e6ff' },
  caoh2:{ f:'Ca(OH)₂', n:'氫氧化鈣', k:'base', d:'俗稱熟石灰、消石灰，可以改良酸性土壤。', lc:'#eef0f6' },

  nh3aq:{ f:'NH₃(aq)', n:'氨水', k:'base', d:'弱鹼，會讓紅色石蕊試紙變藍。', lc:'#cfe3ff' },
  limew:{ f:'Ca(OH)₂(aq)', n:'澄清石灰水', k:'sol', d:'遇到二氧化碳會變混濁，可以用來檢驗二氧化碳。', lc:'#e8f8ff' },
  brine:{ f:'NaCl(aq)', n:'食鹽水', k:'sol', d:'電解食鹽水可以製造氫氧化鈉、氫氣和氯氣。', lc:'#bfe8ff' },

  { t:'🧼 自己做肥皂', d:'做出肥皂。', s:'soap', h:['肥皂要用油和強鹼一起加熱。','動植物油＋氫氧化鈉，選 🔥 加熱點燃。'] },
  { t:'🏭 工業之母', d:'做出硫酸。', s:'h2so4', h:['二氧化硫要先變成三氧化硫，再溶於水。','二氧化硫＋氧氣，選 ⚗️ 催化劑；再加水。'] },
  { t:'🌩️ 閃電的禮物', d:'從空氣做出硝酸。', s:'hno3', h:['閃電能讓氮氣和氧氣反應。','氮氣＋氧氣（⚡ 通電）→ 一氧化氮 → 加氧氣 → 二氧化氮 → 加水。'] },
  { t:'🍎 水果香味', d:'做出有水果香味的酯。', s:'ester', h:['酸和醇可以結合成酯。','乙酸＋乙醇，選 ⚗️ 催化劑。'] }
];

/* ===== 存檔 ===== */
const $ = function(id){ return document.getElementById(id); };
const START = Object.keys(S).filter(function(k){ return S[k].start; });
const store = (function(){
  try{ const s = JSON.parse(localStorage.getItem('chem-alchemy')); if(s && s.found) return s; }catch(e){}
  return { found:START.slice(), done:[], hints:{}, mis:[] };
})();
function save(){ try{ localStorage.setItem('chem-alchemy', JSON.stringify(store)); }catch(e){} }

/* ===== 音效 ===== */
let ac = null, soundOn = true;
function tone(freqs, dur, type, gap){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach(function(fq,i){
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*(gap||dur);
      o.type = type||'sine'; o.frequency.value = fq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
    });
  }catch(e){}
}
function sPick(){ tone([660], 0.06, 'sine'); }
function sBubble(){ tone([300,380,460,560], 0.07, 'sine'); }
function sNew(){ tone([523,659,784,1047], 0.1, 'triangle'); }
function sNo(){ tone([220,196], 0.12, 'triangle'); }

/* ===== 畫面元件 ===== */
function tileHTML(k, extra){
  const s = S[k], L = s.f.length, fs = L > 5 ? Math.max(9, Math.round(100/L)) : 0;
  return '<button class="tile '+(extra||'')+'" data-k="'+k+'" style="--cc:'+CATS[s.k].c+'"><span class="fm"'+(fs?' style="font-size:'+fs+'px"':'')+'>'+s.f+'</span><span class="nm">'+s.n+'</span></button>';
}
let slots = [null, null], cond = 'none', filter = 'all', newSet = {};
function renderProg(){
  const n = store.found.length, N = Object.keys(S).length;
  $('prog').innerHTML = '已發現 <b>'+n+'</b> / '+N;
  $('prog2').innerHTML = $('prog').innerHTML + '　反應 <b>'+store.done.length+'</b> / '+R.length;
  const left = MISSIONS.filter(function(m, i){ return store.mis.indexOf(i) < 0; }).length;
  $('misBadge').hidden = !left; $('misBadge').textContent = left;
}
function renderFilters(){
  const cats = ['all'].concat(Object.keys(CATS).filter(function(c){ return store.found.some(function(k){ return S[k].k===c; }); }));
  $('filters').innerHTML = cats.map(function(c){
    return '<button class="fchip'+(filter===c?' on':'')+'" data-c="'+c+'">'+(c==='all' ? '全部' : '<i style="background:'+CATS[c].c+'"></i>'+CATS[c].n)+'</button>';
  }).join('');
  document.querySelectorAll('.fchip').forEach(function(b){ b.onclick = function(){ filter = b.dataset.c; renderFilters(); renderInv(); }; });
}
function renderInv(){
  const order = Object.keys(S);
  const list = store.found.slice().sort(function(a,b){ return order.indexOf(a) - order.indexOf(b); }).filter(function(k){ return filter==='all' || S[k].k===filter; });
  $('inv').innerHTML = list.map(function(k){ return tileHTML(k, (newSet[k]?'new ':'')+(slots.indexOf(k)>=0?'picked':'')); }).join('');
  document.querySelectorAll('#inv .tile').forEach(function(b){ b.onclick = function(){ pick(b.dataset.k); }; });
}
function renderSlots(){
  [0,1].forEach(function(i){
    const el = $('slot'+i);
    if(slots[i]){ el.innerHTML = tileHTML(slots[i]); el.querySelector('.tile').onclick = function(){ slots[i] = null; if(i===0 && slots[1]){ slots[0] = slots[1]; slots[1] = null; } renderSlots(); renderInv(); }; }
    else el.textContent = i===0 ? '點下面的物質放進來' : '可以只放一種';
  });
  $('goBtn').disabled = !slots[0];
  if(typeof updateJump === 'function') updateJump();
}
function renderConds(){
  $('conds').innerHTML = CONDS.map(function(c){ return '<button class="cond'+(cond===c.k?' on':'')+'" data-c="'+c.k+'"><span class="e">'+c.e+'</span>'+c.n+'</button>'; }).join('');
  document.querySelectorAll('.cond').forEach(function(b){ b.onclick = function(){ cond = b.dataset.c; renderConds(); }; });
}
function pick(k){
  sPick();
  if(newSet[k]){ delete newSet[k]; }
  const at = slots.indexOf(k);
  if(at >= 0){ slots[at] = null; if(at===0 && slots[1]){ slots[0] = slots[1]; slots[1] = null; } }
  else if(!slots[0]) slots[0] = k;
  else if(!slots[1]) slots[1] = k;
  else slots[1] = k;
  renderSlots(); renderInv();
}

/* ===== 反應 ===== */
$('goBtn').onclick = function(){
  if(!slots[0]) return;
  const a = slots.filter(Boolean).sort(), key = a.join('+'), r = RBY[key+'|'+cond];
  const fl = $('flask');
  fl.classList.remove('boil','fail'); void fl.offsetWidth;
  if(!r){
    sNo(); fl.classList.add('fail');
    const other = CONDS.filter(function(c){ return RBY[key+'|'+c.k]; });
    $('result').innerHTML = other.length
      ? '<div class="tip">有一點點動靜……可是條件好像不對。</div><div class="mini">這'+(a.length>1?'兩種物質':'種物質')+'可以反應，換一個反應條件試試看！</div>'
      : '<div class="meh">什麼事也沒有發生……</div><div class="mini">'+(a.length>1 && a[0]===a[1] ? '同一種物質放兩次不會反應喔。' : '試試別的組合或條件吧！')+'</div>';
    return;
  }
  fl.classList.add('boil'); sBubble();
  $('liq').setAttribute('fill', S[r.p[0]].lc || '#5ef2d6');
  const fresh = r.p.filter(function(k){ return store.found.indexOf(k) < 0; });
  fresh.forEach(function(k){ store.found.push(k); newSet[k] = true; });
  const firstTime = store.done.indexOf(r.id) < 0;
  if(firstTime) store.done.push(r.id);
  save();
  $('result').innerHTML = '<div class="eq">'+r.eq+'</div><div class="note">'+r.note+'</div>'
    + (r.warn ? '<div class="warn">⚠️ '+r.warn+'</div>' : '')
    + '<div class="prods">'+r.p.map(function(k){ return tileHTML(k, fresh.indexOf(k)>=0 ? 'new' : ''); }).join('')+'</div>'
    + (fresh.length ? '' : '<div class="mini">'+(firstTime ? '新的反應！不過產物之前都發現過了。' : '這個反應之前做過了。')+'</div>');
  document.querySelectorAll('#result .tile').forEach(function(b){ b.onclick = function(){ showInfo(b.dataset.k); }; });
  if(fresh.length) setTimeout(sNew, 300);
  renderProg(); renderFilters(); renderInv(); checkMissions();
};

/* ===== 任務 ===== */
function acidCount(){ return store.found.filter(function(k){ return S[k].k==='acid' || S[k].acid; }).length; }
function misDone(m){
  if(m.s) return store.found.indexOf(m.s) >= 0;
  if(m.r) return store.done.indexOf(m.r) >= 0;
  if(m.acids) return acidCount() >= m.acids;
  return false;
}
let toastTimer = null;
function toast(msg){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.remove(); }, 2600);
}
function checkMissions(){
  MISSIONS.forEach(function(m, i){
    if(store.mis.indexOf(i) < 0 && misDone(m)){ store.mis.push(i); save(); toast('任務完成：'+m.t); }
  });
  renderProg();
  if($('v-mis').classList.contains('on')) renderMissions();
}
function renderMissions(){
  $('missions').innerHTML = MISSIONS.map(function(m, i){
    const done = store.mis.indexOf(i) >= 0, h = store.hints[i] || 0;
    let extra = '';
    if(m.acids) extra = '（目前 '+Math.min(acidCount(), m.acids)+' / '+m.acids+'）';
    return '<div class="mis'+(done?' done':'')+'"><div class="t">'+m.t+(done?'<span class="ok">✓ 完成</span>':'')+'</div>'
      + '<div class="d">'+m.d+extra+'</div>'
      + (!done ? m.h.slice(0, h).map(function(x, j){ return '<div class="h">提示 '+(j+1)+'：'+x+'</div>'; }).join('') + (h < m.h.length ? '<button class="hb" data-i="'+i+'">'+(h ? '再給一個提示' : '給我提示')+'</button>' : '') : '')
      + '</div>';
  }).join('');
  document.querySelectorAll('.hb').forEach(function(b){ b.onclick = function(){ const i = +b.dataset.i; store.hints[i] = (store.hints[i]||0) + 1; save(); renderMissions(); }; });
}

/* ===== 圖鑑 ===== */
function renderBook(){
  $('book').innerHTML = Object.keys(CATS).map(function(c){
    const ks = Object.keys(S).filter(function(k){ return S[k].k===c; });
    const got = ks.filter(function(k){ return store.found.indexOf(k) >= 0; }).length;
    return '<div class="cat-sec"><h3><i style="background:'+CATS[c].c+'"></i>'+CATS[c].n+'　<span style="color:var(--soft)">'+got+' / '+ks.length+'</span></h3><div class="grid">'
      + ks.map(function(k){ return store.found.indexOf(k) >= 0 ? tileHTML(k) : '<div class="tile unk"><span class="fm">?</span><span class="nm">尚未發現</span></div>'; }).join('')
      + '</div></div>';
  }).join('');
  document.querySelectorAll('#book .tile[data-k]').forEach(function(b){ b.onclick = function(){ showInfo(b.dataset.k); }; });
}
function showInfo(k){
  const s = S[k];
  const made = R.filter(function(r){ return r.p.indexOf(k) >= 0 && store.done.indexOf(r.id) >= 0; });
  const used = R.filter(function(r){ return r.a.indexOf(k) >= 0; });
  const usedDone = used.filter(function(r){ return store.done.indexOf(r.id) >= 0; }).length;
  $('mbox').innerHTML = '<div class="big">'+tileHTML(k)+'<div><h3>'+s.n+'</h3><div class="cat">'+CATS[s.k].n+'　'+s.f+'</div></div></div>'
    + '<p>'+s.d+'</p>'
    + '<div class="how">'+(s.start ? '<b>一開始就有的物質。</b><br>' : '')
    + (made.length ? '<b>做出它的方法：</b><br>'+made.map(function(r){ return r.eq+'　'+CONDS.filter(function(c){ return c.k===r.c; })[0].e; }).join('<br>')+'<br>' : '')
    + '<b>可以用它來做的反應：</b>已發現 '+usedDone+' / '+used.length+' 個</div>'
    + '<button class="close" id="closeBtn">關閉</button>';
  $('modal').hidden = false;
  $('closeBtn').onclick = function(){ $('modal').hidden = true; };
}
$('modal').onclick = function(e){ if(e.target === $('modal')) $('modal').hidden = true; };
let resetArm = false;
$('resetBtn').onclick = function(){
  if(!resetArm){ resetArm = true; $('resetBtn').textContent = '確定要清除所有進度？再按一次'; setTimeout(function(){ resetArm = false; $('resetBtn').textContent = '重新開始'; }, 4000); return; }
  resetArm = false; $('resetBtn').textContent = '重新開始';
  store.found = START.slice(); store.done = []; store.hints = {}; store.mis = []; save();
  slots = [null, null]; newSet = {}; renderAll(); renderBook();
  $('result').innerHTML = '<span class="meh">進度已經清除，重新開始探索吧！</span>';
};

/* ===== 分頁、音效 ===== */
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x===t); });
    document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.id==='v-'+t.dataset.v); });
    if(t.dataset.v==='mis') renderMissions();
    if(t.dataset.v==='book') renderBook();
    updateJump();
  };
});
function renderSound(){ $('soundBtn').textContent = soundOn ? '🔊 音效開' : '🔇 音效關'; }
$('soundBtn').onclick = function(){ soundOn = !soundOn; renderSound(); };
/* 手機上燒杯捲出畫面時，顯示「去燒杯」按鈕 */
let benchVisible = true;
try{
  new IntersectionObserver(function(es){ benchVisible = es[0].isIntersecting; updateJump(); }).observe(document.querySelector('.bench .slots'));
}catch(e){}
function updateJump(){
  const show = !benchVisible && slots[0] && window.innerWidth < 880 && $('v-lab').classList.contains('on');
  $('jump').hidden = !show;
  if(show) $('jump').innerHTML = '燒杯：'+slots.filter(Boolean).map(function(k){ return S[k].f; }).join(' ＋ ')+'　↑ 去反應';
}
$('jump').onclick = function(){ document.querySelector('.bench').scrollIntoView({ behavior:'smooth', block:'start' }); };
function renderAll(){ renderProg(); renderFilters(); renderInv(); renderSlots(); renderConds(); renderSound(); }
renderAll(); checkMissions();
</script>
</body>
