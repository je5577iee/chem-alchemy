<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>化學反應實驗室</title>
<!--
  化學反應實驗室：一個任務一個反應，選兩種物質放進燒杯，看看會發生什麼事
  - 單一 HTML 檔，完全離線可用，不引用任何外部資源
  - 所有圖都是程式畫出來的原創圖
  - 進度只存在本機瀏覽器，不蒐集任何個人資料
-->
<style>
:root{
  --bg:#171a33; --panel:#22264a; --panel2:#2b3060; --ink:#eef0ff; --soft:#a9afd8; --line:#3a4078;
  --cyan:#5ef2d6; --pink:#ff7ab6; --warn:#ffb057; --ok:#8af5a5;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{
  color:var(--ink); font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:
    radial-gradient(circle at 15% 0%, rgba(94,242,214,.12), transparent 40%),
    radial-gradient(circle at 90% 100%, rgba(255,122,182,.12), transparent 40%),
    radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.5px) 0 0/22px 22px,
    var(--bg);
  background-attachment:fixed;
  user-select:none; -webkit-user-select:none;
}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none; touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cyan); outline-offset:2px}
[hidden]{display:none !important}
#app{max-width:1180px; margin:0 auto; padding:14px 16px 30px}

/* ---------- 頂部 ---------- */
header{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.logo{display:flex; align-items:center; gap:10px}
.logo svg{width:44px; height:44px}
.logo h1{margin:0; font-size:clamp(22px,6vw,32px); letter-spacing:3px; background:linear-gradient(90deg, var(--cyan), var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent}
.prog{font-weight:800; color:var(--soft)}
.prog b{color:var(--cyan); font-size:1.15em}
.icon-btn{padding:8px 12px; border-radius:9px; background:var(--panel); color:var(--soft); font-weight:700; font-size:14px; border:1px solid var(--line)}
.icon-btn.r{margin-left:auto}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px}
.panel h2{margin:0 0 10px; font-size:16px; color:var(--soft); letter-spacing:1px}

/* ---------- 版面 ---------- */
.lab{display:grid; gap:14px; grid-template-columns:minmax(0,1fr); grid-template-areas:"mis" "inv" "bench"}
.mis{grid-area:mis} .inv{grid-area:inv} .bench{grid-area:bench}
@media (min-width:880px){
  .lab{grid-template-columns:minmax(0,1fr) 410px; grid-template-areas:"mis bench" "inv bench"; grid-template-rows:auto 1fr; align-items:start}
  .bench{position:sticky; top:12px}
}

/* ---------- 任務列表 ---------- */
.view{display:none} .view.on{display:block}
.lead{color:var(--soft); font-size:16px; line-height:1.7; margin:0 0 6px}
.grp h3{margin:18px 0 10px; font-size:17px; display:flex; align-items:center; gap:8px}
.grp h3 i{width:12px; height:12px; border-radius:4px; background:var(--gc)}
.cards{display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(250px,1fr))}
.card{text-align:left; background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--gc); border-radius:14px; padding:12px 14px; display:grid; grid-template-columns:auto 1fr; gap:3px 12px; align-items:center; transition:transform .12s}
.card:hover{transform:translateY(-2px); border-color:var(--cyan); border-left-color:var(--gc)}
.card .no{grid-row:span 3; width:44px; height:44px; border-radius:12px; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900; color:var(--cyan)}
.card .t{font-weight:900; font-size:18px}
.card .d{color:var(--soft); font-size:14px; line-height:1.45}
.card .s{font-size:13px; font-weight:800; color:var(--soft)}
.card.done{background:#1f3a3f}
.card.done .no{background:#2f8a63; color:#fff}
.card.done .s{color:var(--ok)}
.topbar{margin-bottom:12px}
.cat{display:inline-block; font-size:13px; font-weight:800; color:#10132a; background:var(--cyan); padding:3px 10px; border-radius:999px}
.mt{font-size:clamp(22px,5.6vw,28px); font-weight:900; margin:8px 0 4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.mt small{font-size:14px; color:var(--soft); font-weight:800}
.mt .okb{font-size:14px; color:var(--ok)}
.mg{font-size:17px; line-height:1.65; margin:0 0 10px}
.hints{display:grid; gap:6px; margin-bottom:6px}
.hint{background:rgba(94,242,214,.1); color:var(--cyan); border-radius:10px; padding:8px 12px; font-weight:700; line-height:1.55}
.hbtn{justify-self:start; padding:7px 12px; border-radius:9px; background:var(--panel2); font-size:14px; font-weight:800; color:var(--soft)}
.fb{border-radius:10px; line-height:1.6; font-weight:700; font-size:15px; margin-top:8px; padding:9px 12px}
.fb.hint2{background:rgba(255,176,87,.14); color:var(--warn)}
.fb.reveal{background:rgba(94,242,214,.12); color:var(--cyan)}
.fb.info{background:rgba(196,155,255,.14); color:#d9c2ff}
.alldone{text-align:center; padding:6px 0}
.alldone .big{font-size:26px; font-weight:900; color:var(--ok); margin:4px 0 8px}

/* ---------- 物質 ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:8px}
.tile{position:relative; aspect-ratio:1; min-width:0; border-radius:10px; background:#fff; color:#151833; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px; text-align:center; border-top:7px solid var(--cc); box-shadow:0 3px 0 rgba(0,0,0,.35); transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile .fm{font-weight:900; font-size:19px; line-height:1.1; white-space:nowrap; max-width:100%; overflow:hidden}
.tile .st{font-size:.6em; font-weight:800; color:#6b7090; margin-left:1px}
.tile .nm{font-size:12px; font-weight:800; color:#555b7a; margin-top:3px; line-height:1.15}
.tile.new::after{content:"新！"; position:absolute; top:-9px; right:-7px; background:var(--pink); color:#fff; font-size:11px; font-weight:900; padding:2px 6px; border-radius:999px}
.tile.picked{outline:4px solid var(--cyan); outline-offset:1px; transform:translateY(-3px)}
.tile.ans{animation:ans 1s ease-in-out 3}
@keyframes ans{50%{box-shadow:0 0 0 6px rgba(94,242,214,.7)}}
.legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:12.5px; color:var(--soft); font-weight:700}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px}

/* ---------- 實驗台 ---------- */
.bench{display:grid; gap:12px}
.slots{display:flex; align-items:center; justify-content:center; gap:10px}
.slot{width:100px; height:100px; border-radius:12px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--soft); font-size:13px; text-align:center; padding:6px; background:rgba(0,0,0,.15)}
.slot .tile{width:100%; height:100%; cursor:pointer; box-shadow:none}
.plus{font-size:28px; font-weight:900; color:var(--soft)}
.flaskwrap{display:flex; justify-content:center}
.flaskwrap svg{width:170px; height:170px}
.flaskwrap.shake svg{animation:wob .4s}
@keyframes wob{25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)}}
.go{width:100%; padding:14px; border-radius:12px; font-size:21px; font-weight:900; color:#10132a; background:linear-gradient(90deg, var(--cyan), #8af5a5); box-shadow:0 4px 0 #2a9e88}
.go:active{transform:translateY(3px); box-shadow:0 1px 0 #2a9e88}
.result{border-radius:12px; background:rgba(0,0,0,.2); padding:12px 14px; line-height:1.6}
.result .eq small{font-size:.62em; font-weight:800; opacity:.85}
.result .eq{font-size:clamp(16px,4.4vw,20px); font-weight:900; margin:2px 0 6px; overflow-wrap:anywhere; color:var(--cyan)}
.result .ph{font-size:15.5px}
.result .vn{color:#d9c2ff; font-size:14.5px; margin-top:6px}
.result .life{color:var(--soft); font-size:14.5px; margin-top:8px}
.result .life b{color:var(--ink)}
.result .warn{color:var(--warn); font-size:14px; font-weight:800; margin-top:6px}
.result .prods{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px}
.result .prods .tile{width:78px; height:78px}
.result .meh{color:var(--soft); font-weight:700}
.result .yay{font-size:20px; font-weight:900; color:var(--ok)}
.result .go{margin-top:12px; font-size:18px; padding:12px}
.foot{font-size:12.5px; color:var(--soft); line-height:1.5}
.safety{font-size:13px; color:var(--soft); text-align:center; margin:16px auto 0; max-width:640px; line-height:1.6}

/* 手機：選好物質時，下方出現「開始反應」 */
#mixBar{position:fixed; left:10px; right:10px; bottom:10px; z-index:40; background:var(--panel2); border:1px solid var(--cyan); border-radius:14px; padding:8px 8px 8px 14px; display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,.5)}
#mixBar .names{flex:1; font-weight:800; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#mixBar button{padding:10px 14px; border-radius:10px; font-weight:900; color:#10132a; background:linear-gradient(90deg, var(--cyan), #8af5a5); white-space:nowrap}
@media (min-width:880px){ #mixBar{display:none !important} }

/* SVG 動畫 */
.bub{opacity:0; animation:rise var(--d,1.2s) ease-in infinite; transform-box:fill-box}
@keyframes rise{0%{transform:translateY(0); opacity:0} 20%{opacity:.95} 100%{transform:translateY(var(--r,-60px)); opacity:0}}
.flake{animation:fall 1.6s ease-in infinite; transform-box:fill-box}
@keyframes fall{0%{transform:translateY(-10px); opacity:0} 25%{opacity:1} 100%{transform:translateY(22px); opacity:0}}
.heat{animation:heat 1.4s ease-in-out infinite; opacity:0}
@keyframes heat{0%{opacity:0; transform:translateY(4px)} 50%{opacity:.9} 100%{opacity:0; transform:translateY(-10px)}}
.shrink{transform-box:fill-box; transform-origin:50% 100%; animation:shrink 3s ease-in forwards}
@keyframes shrink{to{transform:scale(.35,.6)}}
.vanish{transform-box:fill-box; transform-origin:50% 100%; animation:vanish 2.6s ease-in forwards}
@keyframes vanish{to{transform:scale(.1,.1); opacity:0}}
.fadein{animation:fadein 1.2s ease-out both}
@keyframes fadein{from{opacity:0}}

@media (max-width:420px){
  .slot{width:88px; height:88px}
  .grid{grid-template-columns:repeat(auto-fill, minmax(72px,1fr))}
  .tile .fm{font-size:17px}
  .logo h1{letter-spacing:1px}
  .logo svg{width:36px; height:36px}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important} .bub,.heat{opacity:.7} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M18 4h12M20 4v14L8 40a3 3 0 0 0 3 4h26a3 3 0 0 0 3-4L28 18V4" fill="none" stroke="#5ef2d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M13 32h22l4 8a2 2 0 0 1-2 3H11a2 2 0 0 1-2-3z" fill="#ff7ab6" opacity=".85"/><circle cx="20" cy="26" r="2" fill="#5ef2d6"/><circle cx="27" cy="22" r="1.5" fill="#5ef2d6"/></svg>
      <h1>化學反應實驗室</h1>
    </div>
    <span class="prog" id="prog"></span>
    <button class="icon-btn r" id="soundBtn"></button>
  </header>

  <!-- 任務列表 -->
  <section class="view on" id="v-home">
    <p class="lead">選一個任務，看看要做出什麼，再從實驗架上挑兩種物質放進燒杯！</p>
    <div id="groups"></div>
    <div style="text-align:center; margin-top:16px"><button class="icon-btn" id="resetBtn">清除完成紀錄</button></div>
  </section>

  <!-- 任務 -->
  <section class="view" id="v-mis">
  <div class="topbar"><button class="icon-btn" id="backBtn">← 任務列表</button></div>
  <div class="lab">
    <section class="panel mis" id="mis"></section>

    <section class="panel inv">
      <h2>實驗架 <span style="font-weight:700">（點一下放進燒杯，最多兩種）</span></h2>
      <div class="grid" id="inv"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel bench" id="bench">
      <h2 style="margin:0">燒杯</h2>
      <div class="slots">
        <div class="slot" id="slot0">點物質放進來</div>
        <span class="plus">＋</span>
        <div class="slot" id="slot1">再放一種</div>
      </div>
      <div class="flaskwrap" id="flaskwrap"></div>
      <button class="go" id="goBtn">開始反應！</button>
      <div class="result" id="result"><span class="meh">從實驗架選兩種物質放進燒杯，再按「開始反應」。</span></div>
      <div class="foot">※ 遊戲只收錄任務會用到的反應。選錯時沒有反應，不代表真實世界中這兩種物質不會反應。</div>
    </section>
  </div>
  </section>

  <p class="safety">⚠️ 遊戲裡很多藥品有腐蝕性或危險性。真的做實驗時，一定要有老師在旁邊，請勿自行嘗試。</p>
</div>

<div id="mixBar" hidden><span class="names" id="mixNames"></span><button id="mixGo">開始反應！</button></div>

<script>
/* =====================================================================
   物質　f 化學式、n 名稱、k 類別、c 在燒杯裡的顏色、start 一開始就有
   ===================================================================== */
const CATS = {
  acid:{n:'酸', c:'#ff6b81'}, base:{n:'鹼', c:'#6f9bff'}, salt:{n:'鹽類', c:'#c49bff'},
  metal:{n:'金屬', c:'#9fb6d6'}, oxide:{n:'氧化物', c:'#ffa25e'}, gas:{n:'元素氣體', c:'#5ef2d6'}, org:{n:'有機物', c:'#ffd84d'}
};
const S = {
  ch3cooh: {f:'CH₃COOH', n:'醋（乙酸水溶液）', st:'aq',      k:'org',   c:'#f3eed6', start:1},
  nahco3:  {f:'NaHCO₃',  n:'碳酸氫鈉（小蘇打）', st:'s', k:'salt',  c:'#ffffff', start:1},
  hcl:     {f:'HCl',     n:'鹽酸', st:'aq',          k:'acid',  c:'#e6f2ff', start:1},
  mgoh2:   {f:'Mg(OH)₂', n:'氫氧化鎂', st:'s',       k:'base',  c:'#f4f4f4', start:1},
  naoh:    {f:'NaOH',    n:'氫氧化鈉水溶液', st:'aq',       k:'base',  c:'#e9f5ff', start:1},
  caco3:   {f:'CaCO₃',   n:'碳酸鈣（大理石）', st:'s', k:'salt',  c:'#eeeeee', start:1},
  limewater:{f:'Ca(OH)₂',n:'澄清石灰水', st:'aq',     k:'base',  c:'#dff4fa', start:1},
  mg:      {f:'Mg',      n:'鎂', st:'s',            k:'metal', c:'#d9dde8', start:1},
  zn:      {f:'Zn',      n:'鋅', st:'s',            k:'metal', c:'#c3cad6', start:1},
  fe:      {f:'Fe',      n:'鐵', st:'s',            k:'metal', c:'#9aa1ad', start:1},
  cuso4:   {f:'CuSO₄',   n:'硫酸銅水溶液', st:'aq',         k:'salt',  c:'#2f7fd6', start:1},
  fecl3:   {f:'FeCl₃',   n:'氯化鐵水溶液', st:'aq',         k:'salt',  c:'#d99a2b', start:1},
  cacl2:   {f:'CaCl₂',   n:'氯化鈣水溶液', st:'aq',         k:'salt',  c:'#eef6fb', start:1},
  na2co3:  {f:'Na₂CO₃',  n:'碳酸鈉水溶液', st:'aq',         k:'salt',  c:'#eef6fb', start:1},
  // 反應會做出來的
  co2:     {f:'CO₂',     n:'二氧化碳', st:'g',       k:'oxide', c:'#eef6fb'},
  h2o:     {f:'H₂O',     n:'水', st:'l',            k:'oxide', c:'#cfeaff'},
  h2:      {f:'H₂',      n:'氫氣', st:'g',          k:'gas',   c:'#eef6fb'},
  ch3coona:{f:'CH₃COONa',n:'乙酸鈉', st:'aq',         k:'salt',  c:'#eef6fb'},
  mgcl2:   {f:'MgCl₂',   n:'氯化鎂', st:'aq',         k:'salt',  c:'#eef6fb'},
  nacl:    {f:'NaCl',    n:'食鹽水（氯化鈉）', st:'aq',  k:'salt',  c:'#eef6fb'},
  zncl2:   {f:'ZnCl₂',   n:'氯化鋅', st:'aq',         k:'salt',  c:'#eef6fb'},
  fecl2:   {f:'FeCl₂',   n:'氯化亞鐵', st:'aq',       k:'salt',  c:'#cfe8c4'},
  feso4:   {f:'FeSO₄',   n:'硫酸亞鐵', st:'aq',       k:'salt',  c:'#cfe8c4'},
  cu:      {f:'Cu',      n:'銅', st:'s',            k:'metal', c:'#c8643a'},
  feoh3:   {f:'Fe(OH)₃', n:'氫氧化鐵', st:'s',       k:'base',  c:'#a0522d'},
  cuoh2:   {f:'Cu(OH)₂', n:'氫氧化銅', st:'s',       k:'base',  c:'#4a90e2'},
  na2so4:  {f:'Na₂SO₄',  n:'硫酸鈉', st:'aq',         k:'salt',  c:'#eef6fb'},
  sugar:   {f:'C₁₂H₂₂O₁₁', n:'蔗糖（砂糖）', st:'s',   k:'org',   c:'#f6f0e0'}
};
const ORDER = Object.keys(S);

/* =====================================================================
   反應　r 反應物、eq 方程式（已配平）、p 產物、fx 燒杯畫面、ph 現象、vn 換一種也可以時的說明
   fx：liq 最後的顏色、bub 冒泡、heat 放熱、ppt 沉澱顏色、cloudy 變混濁、
       solid 一開始在底部的固體（stone 石頭、metal 金屬、powder 白色粉末）、coat 金屬表面變色、gone 固體變小
   ===================================================================== */
const RX = {
  vinegar:   {r:['ch3cooh','nahco3'], eq:'CH₃COOH(aq) + NaHCO₃(s) → CH₃COONa(aq) + H₂O(l) + CO₂(g)', p:['ch3coona','h2o','co2'],
              fx:{liq:'#f3eed6', bub:'big', solid:'powder', gone:2}, ph:'一混合就冒出大量泡泡，像火山一樣噴出來！泡泡裡的氣體是二氧化碳。'},
  mgoh2:     {r:['hcl','mgoh2'], eq:'Mg(OH)₂(s) + 2HCl(aq) → MgCl₂(aq) + 2H₂O(l)', p:['mgcl2','h2o'],
              fx:{liq:'#e6f2ff', solid:'powder', gone:2}, ph:'白色的氫氧化鎂慢慢溶解，混濁的液體變透明了。'},
  neut:      {r:['hcl','naoh'], eq:'HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)', p:['nacl','h2o'],
              fx:{liq:'#e6f2ff', heat:1}, ph:'看起來沒什麼變化，但燒杯摸起來變溫熱了，這是中和反應放出的熱。'},
  caco3:     {r:['caco3','hcl'], eq:'CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + H₂O(l) + CO₂(g)', p:['cacl2','h2o','co2'],
              fx:{liq:'#e6f2ff', bub:1, solid:'stone', gone:1}, ph:'大理石表面冒出許多泡泡，石頭慢慢變小。'},
  nahco3hcl: {r:['hcl','nahco3'], eq:'NaHCO₃(s) + HCl(aq) → NaCl(aq) + H₂O(l) + CO₂(g)', p:['nacl','h2o','co2'],
              fx:{liq:'#e6f2ff', bub:'big', solid:'powder', gone:2}, ph:'冒出大量泡泡！',
              vn:'小蘇打也可以做出二氧化碳！不過實驗室最常用大理石，因為它便宜，反應也比較平穩，方便收集氣體。'},
  na2co3hcl: {r:['hcl','na2co3'], eq:'Na₂CO₃(aq) + 2HCl(aq) → 2NaCl(aq) + H₂O(l) + CO₂(g)', p:['nacl','h2o','co2'],
              fx:{liq:'#e6f2ff', bub:'big'}, ph:'冒出大量泡泡！',

let ac = null;
function tone(freqs, dur, type, gap){
  if(store.sound === false) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach(function(fq,i){
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*(gap||dur);
      o.type = type||'sine'; o.frequency.value = fq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
    });
  }catch(e){}
}

const FLASK = 'M60 10h30M64 10v40L28 120a10 10 0 0 0 9 14h76a10 10 0 0 0 9-14L86 50V10';
const LIQ = 'M47 86h56l18 34a7 7 0 0 1-6 10H35a7 7 0 0 1-6-10z';
function bubbles(n, big){
  let s = '';
  for(let k=0;k<n;k++){
    const x = 40 + (k*37 % 70), r = big ? 3 + (k*5 % 4) : 2 + (k % 2);
    s += '<circle class="bub" cx="'+x+'" cy="'+(126 - (k*11 % 12))+'" r="'+r+'" fill="#fff" style="--r:'+(big ? -110 : -46)+'px;--d:'+(1+(k%4)*.25)+'s;animation-delay:'+((k*.21)%1.2).toFixed(2)+'s"/>';
  }
  return s;
}
function isLight(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.8;
}
function goneCls(g){ return g === 2 ? 'vanish' : g ? 'shrink' : ''; }
function flaskSVG(o){
  // o: {liq, solid, solidColor, coat, gone, bub, heat, ppt, cloudy, empty}
  let s = '<svg viewBox="0 0 150 150" aria-hidden="true">';
  if(o.heat) s += '<ellipse cx="75" cy="140" rx="54" ry="8" fill="#ff7a3c" opacity=".35"/>';
  if(!o.empty){
    const clear = !o.cloudy && isLight(o.liq);
    s += '<path d="'+LIQ+'" fill="'+o.liq+'" opacity="'+(o.cloudy ? .95 : clear ? .2 : .72)+'" class="'+(o.anim ? 'fadein' : '')+'"/>';
    s += '<path d="M47 86h56" stroke="'+(o.cloudy ? '#ffffff' : clear ? '#cfe6ff' : o.liq)+'" stroke-width="2.5" opacity=".75"/>';
  }
  if(o.ppt){
    s += '<path d="M31 122h88l2 3a7 7 0 0 1-6 9H35a7 7 0 0 1-6-9z" fill="'+o.ppt+'" class="fadein"/>';
    for(let k=0;k<7;k++) s += '<circle class="flake" cx="'+(44+k*10)+'" cy="'+(98+(k%3)*6)+'" r="2.6" fill="'+o.ppt+'" style="animation-delay:'+(k*.22).toFixed(2)+'s"/>';
  }
  if(o.solid === 'stone') s += '<path d="M58 130l4-10 12-4 10 4 6 10z" fill="#e3e1da" stroke="#b9b6ac" stroke-width="1.5" class="'+goneCls(o.gone)+'"/>';
  if(o.solid === 'powder') s += '<path d="M48 131c6-8 14-9 27-9s21 1 27 9z" fill="#ffffff" class="'+goneCls(o.gone)+'"/>';
  if(o.solid === 'metal'){
    s += '<rect x="56" y="118" width="38" height="11" rx="3" fill="'+(o.metalColor || '#cfd5de')+'" class="'+goneCls(o.gone)+'"/>';
    if(o.coat) s += '<rect x="56" y="118" width="38" height="11" rx="3" fill="'+o.coat+'" class="fadein"/>';
  }
  if(o.bub) s += bubbles(o.bub === 'big' ? 14 : o.bub === 'small' ? 5 : 9, o.bub === 'big');
  if(o.bub === 'big') s += '<g class="fadein"><circle cx="68" cy="12" r="7" fill="#fff" opacity=".85"/><circle cx="80" cy="8" r="8" fill="#fff" opacity=".85"/><circle cx="75" cy="2" r="6" fill="#fff" opacity=".85"/></g>';
  s += '<path d="'+FLASK+'" fill="rgba(255,255,255,.06)" stroke="#cfd4ff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
  if(o.heat){
    [[30,92],[118,92],[22,112],[126,112]].forEach(function(p, k){ s += '<path class="heat" style="animation-delay:'+(k*.35)+'s" d="M'+p[0]+' '+p[1]+'c-3-4 3-6 0-10s3-6 0-10" fill="none" stroke="#ff9f5a" stroke-width="2.4" stroke-linecap="round"/>'; });
  }
  return s + '</svg>';
}
function idleFlask(){
  const a = slots[0], b = slots[1];
  if(!a && !b) return flaskSVG({empty:true});
  const ks = [a, b].filter(Boolean);
  const liquid = ks.filter(function(k){ return ['metal'].indexOf(S[k].k) < 0 && ['caco3','nahco3','mgoh2','co2','h2'].indexOf(k) < 0; });
  const o = {liq: liquid.length ? S[liquid[0]].c : '#cfeaff', empty: !liquid.length};
  ks.forEach(function(k){
    if(k === 'caco3') o.solid = 'stone';
    else if(k === 'nahco3' || k === 'mgoh2') o.solid = 'powder';
    else if(S[k].k === 'metal'){ o.solid = 'metal'; o.metalColor = S[k].c; }
  });
  return flaskSVG(o);
}

  h += '</div>';
  if(lastFb) h += '<div class="fb '+lastFb.cls+'">'+lastFb.html+'</div>';
  $('mis').innerHTML = h;
  if($('hintBtn')) $('hintBtn').onclick = function(){ sPick(); hintLv++; renderMission(); };
}

function renderInv(){
  $('inv').innerHTML = shelf.map(function(k){ return tileHTML(k, slots.indexOf(k) >= 0 ? 'picked' : ''); }).join('');
  [].forEach.call($('inv').querySelectorAll('.tile'), function(b){ b.onclick = function(){ toggle(b.dataset.k); }; });
  $('legend').innerHTML = Object.keys(CATS).filter(function(c){ return shelf.some(function(k){ return S[k].k === c; }); })
    .map(function(c){ return '<span><i style="background:'+CATS[c].c+'"></i>'+CATS[c].n+'</span>'; }).join('');
}

function renderSlots(){
  [0,1].forEach(function(i){
    const el = $('slot'+i), k = slots[i];
    if(k){
      el.innerHTML = tileHTML(k);
      el.firstChild.onclick = function(){ toggle(k); };
    } else el.textContent = i === 0 ? '點物質放進來' : '再放一種';
  });
  const names = slots.filter(Boolean).map(function(k){ return S[k].n; });
  $('mixNames').textContent = names.length ? names.join(' ＋ ') : '';
  updateBar();
}

function toggle(k){
  if(solved) return;
  sPick();
  const at = slots.indexOf(k);
  if(at >= 0) slots[at] = null;
  else if(!slots[0]) slots[0] = k;
  else if(!slots[1]) slots[1] = k;
  else slots[1] = k;
  $('flaskwrap').innerHTML = idleFlask();
  renderSlots(); renderInv();
}

function setFb(cls, html){ lastFb = {cls:cls, html:html}; renderMission(); }
function shake(){ const w = $('flaskwrap'); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); }

function go(){
  if(mi < 0 || solved) return;
  const m = MIS[mi];
  if(!slots[0] || !slots[1]){
    sHint(); shake();
    setFb('hint2', '要放<b>兩種</b>物質，才能開始反應喔！');
    scrollToMis();
    return;
  }
  const k = key(slots[0], slots[1]);
  const rid = RX_BY_KEY[k];
  if(rid && m.ok.indexOf(rid) >= 0){ success(rid); return; }
  sHint(); shake();
  if(m.near && m.near[k]){ setFb('info', m.near[k]); scrollToMis(); return; }
  if(rid && MIS_OF_RX[rid] !== undefined){
    const j = MIS_OF_RX[rid];
    setFb('info', '這一組也會反應！它是任務 '+(j+1)+'「'+MIS[j].t+'」的反應。這個任務要找的是別的組合喔。');
    scrollToMis(); return;
  }
  tries++;
  if(tries === 1){
    hintLv = Math.max(hintLv, 1);
    setFb('hint2', pick(CHEER)+' 這不是這個任務要找的組合。看看上面的提示，再試一次！');
  } else {
    hintLv = Math.max(hintLv, 1);
    const r = RX[m.ok[0]].r;
    slots = [r[0], r[1]];
    $('flaskwrap').innerHTML = idleFlask();
    renderSlots(); renderInv();
    [].forEach.call(document.querySelectorAll('#inv .tile'), function(b){ if(r.indexOf(b.dataset.k) >= 0) b.classList.add('ans'); });
    setFb('reveal', '答案是：<b>'+m.h[1]+'</b>。我幫你放進燒杯了，按「開始反應」看看會發生什麼事！');
  }
  scrollToMis();
}

function nextMission(){
  for(let d=1; d<=MIS.length; d++){ const j = (mi + d) % MIS.length; if(store.done.indexOf(j) < 0) return j; }
  return -1;
}

function success(rid){
  const r = RX[rid], m = MIS[mi], fx = r.fx;
  solved = true;
  sBubble();
  const metal = r.r.filter(function(k){ return S[k].k === 'metal'; })[0];
  const before = {liq: fx.from || '#e6f2ff', solid: fx.solid, metalColor: metal ? S[metal].c : null};
  $('flaskwrap').innerHTML = flaskSVG(before);
  setTimeout(function(){
    $('flaskwrap').innerHTML = flaskSVG({liq:fx.liq, anim:true, solid:fx.solid, metalColor:before.metalColor, coat:fx.coat, gone:fx.gone, bub:fx.bub, heat:fx.heat, ppt:fx.ppt, cloudy:fx.cloudy});
  }, 450);
  if(store.done.indexOf(mi) < 0){ store.done.push(mi); save(); }
  setTimeout(sWin, 500);
  const next = nextMission();
  $('result').innerHTML = '<div class="yay">'+pick(PRAISE)+'</div><div class="eq">'+r.eq.replace(/\((aq|s|l|g)\)/g, '<small>($1)</small>')+'</div><div class="ph">'+r.ph+'</div>'+
    (r.vn ? '<div class="vn">✨ '+r.vn+'</div>' : '')+
    '<div class="prods">'+r.p.map(function(k){ return tileHTML(k); }).join('')+'</div>'+
    '<div class="life">🌱 '+m.life+'</div>'+
    (m.warn ? '<div class="warn">⚠️ '+m.warn+'</div>' : '')+
    (next >= 0 ? '<button class="go" id="nextBtn">下一個任務：'+MIS[next].t+' →</button>' : '<div class="yay" style="margin-top:10px">🎉 10 個任務全部完成！</div>')+
    '<button class="hbtn" id="listBtn" style="margin-top:10px">← 回任務列表</button>';
  if($('nextBtn')) $('nextBtn').onclick = function(){ sPick(); openMission(next); };
  $('listBtn').onclick = function(){ sPick(); renderHome(); };
  lastFb = null;
  slots = [null, null];
  renderProg(); renderMission(); renderInv(); renderSlots();
  $('bench').scrollIntoView({behavior:'smooth', block:'start'});
}

function scrollToMis(){
  if(window.innerWidth < 880) $('mis').scrollIntoView({behavior:'smooth', block:'start'});
}

/* 手機：燒杯不在畫面上時，下方出現「開始反應」 */
let goVisible = true;
function updateBar(){ $('mixBar').hidden = goVisible || solved || mi < 0 || !slots.some(Boolean); }
if('IntersectionObserver' in window){
  new IntersectionObserver(function(es){ goVisible = es[0].isIntersecting; updateBar(); }).observe($('goBtn'));
}
$('goBtn').onclick = go;
$('mixGo').onclick = function(){ go(); };

function renderSound(){ $('soundBtn').textContent = store.sound === false ? '🔇 音效關' : '🔊 音效開'; }
$('soundBtn').onclick = function(){ store.sound = store.sound === false; save(); renderSound(); sPick(); };

renderSound();
renderHome();
</script>
</body>
</html>
